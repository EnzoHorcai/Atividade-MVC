<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Livros</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #262626;
            background: #f4f1ea;
        }

        header {
            padding: 24px;
            background: #ffffff;
            border-bottom: 1px solid #ded9cc;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 24px;
        }

        h1 {
            margin: 0;
            color: #355a3b;
        }

        nav {
            margin-top: 12px;
        }

        nav a {
            margin-right: 12px;
            color: #355a3b;
        }

        .acoes {
            margin: 24px 0;
        }

        .novo,
        .editar,
        .excluir {
            display: inline-block;
            border: 0;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .novo,
        .editar {
            color: #ffffff;
            background: #355a3b;
        }

        .excluir {
            color: #ffffff;
            background: #a33b32;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ded9cc;
        }

        th {
            background: #355a3b;
            color: #ffffff;
        }

        .vazio {
            color: #666666;
        }
    </style>
</head>
<body>
<header>
    <h1>Livros</h1>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/livros}">Livros</a>
        <a th:href="@{/autor}">Autor</a>
        <a th:href="@{/categorias}">Categorias</a>
        <a th:href="@{/emprestimos}">Empréstimos</a>
        <a th:href="@{/usuarios}">Usuários</a>
    </nav>
</header>

<main>
    <div class="acoes">
        <a class="novo" th:href="@{/livros/novo}">Novo livro</a>
    </div>

    <p class="vazio" th:if="${#lists.isEmpty(livros)}">
        Nenhum livro cadastrado.
    </p>

    <table th:if="${!#lists.isEmpty(livros)}">
        <thead>
        <tr>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="livro : ${livros}">
            <td th:text="${livro.titulo}"></td>
            <td th:text="${livro.autor}"></td>
            <td th:text="${livro.isbn}"></td>
            <td>
                <a class="editar"
                   th:href="@{/livros/{id}/editar(id=${livro.id})}">
                    Editar
                </a>

                <form th:action="@{/livros/{id}/excluir(id=${livro.id})}"
                      method="post"
                      style="display:inline">
                    <button class="excluir"
                            type="submit"
                            onclick="return confirm('Excluir este livro?')">
                        Excluir
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
