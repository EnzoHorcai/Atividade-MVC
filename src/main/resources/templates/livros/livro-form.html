<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloPagina}">Livro</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #262626;
            background: #f4f1ea;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 32px;
            background: #ffffff;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            color: #355a3b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid #bbb5a8;
            border-radius: 6px;
        }

        .acoes {
            margin-top: 24px;
        }

        button,
        .cancelar {
            display: inline-block;
            border: 0;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            color: #ffffff;
            background: #355a3b;
        }

        .cancelar {
            margin-left: 8px;
            color: #355a3b;
            background: #e8eadf;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${tituloPagina}"></h1>

    <form th:if="${livro.id == null}"
          th:action="@{/livros}"
          th:object="${livro}"
          method="post">
        <label for="titulo">Título</label>
        <input id="titulo" type="text" th:field="*{titulo}" required>

        <label for="autor">Autor</label>
        <input id="autor" type="text" th:field="*{autor}" required>

        <label for="isbn">ISBN</label>
        <input id="isbn" type="text" th:field="*{isbn}" required>

        <div class="acoes">
            <button type="submit">Cadastrar</button>
            <a class="cancelar" th:href="@{/livros}">Cancelar</a>
        </div>
    </form>

    <form th:if="${livro.id != null}"
          th:action="@{/livros/{id}(id=${livro.id})}"
          th:object="${livro}"
          method="post">
        <label for="titulo-edicao">Título</label>
        <input id="titulo-edicao" type="text" th:field="*{titulo}" required>

        <label for="autor-edicao">Autor</label>
        <input id="autor-edicao" type="text" th:field="*{autor}" required>

        <label for="isbn-edicao">ISBN</label>
        <input id="isbn-edicao" type="text" th:field="*{isbn}" required>

        <div class="acoes">
            <button type="submit">Salvar alterações</button>
            <a class="cancelar" th:href="@{/livros}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
